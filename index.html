<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortslinien – Lernen und Üben (Mathematik Klasse 7, DFU)</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#22303c; --mut:#6b7785; --line:#e2d9c8;
  --acc:#1f6f78; --acc2:#f2a900; --ok:#2f9e44; --okbg:#e6f6ea; --err:#c92a2a; --errbg:#fdecec;
  --k:#1c6fd1; --ms:#d6336c; --wh:#2f9e44; --mp:#e8590c; --par:#7048e8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
#top{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#top .brand{font-weight:700;font-size:1.1rem;cursor:pointer;margin-right:auto;display:flex;align-items:center;gap:.4rem}
#top .pill{background:rgba(255,255,255,.16);border-radius:99px;padding:.2rem .7rem;font-size:.92rem;white-space:nowrap}
#top .pill.star{background:#fff;color:#7a5200;font-weight:700}
#top button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:.2rem .7rem;cursor:pointer;font-size:.9rem}
main{max-width:1120px;margin:0 auto;padding:1rem .9rem 4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 1px 3px rgba(60,40,0,.06)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:.65rem 1.1rem;font-weight:600;cursor:pointer;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.btn.small{min-height:38px;padding:.35rem .8rem;font-size:.95rem}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)} .en{color:var(--mut);font-style:italic;font-size:.92em}
.crumb{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.crumb h2{margin:0}
/* Login */
.login{max-width:560px;margin:1.5rem auto}
.login label{display:block;font-weight:600;margin:.9rem 0 .25rem}
.login input,.login select{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:1.05rem}
.login input:focus{outline:none;border-color:var(--acc)}
/* Home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem}
.st{cursor:pointer;display:flex;gap:.9rem;align-items:flex-start;transition:transform .12s}
.st:hover{transform:translateY(-2px)}
.st .ico{font-size:2rem;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:#eaf3f3;flex:none}
.st h3{margin:0}
.bar{height:9px;border-radius:9px;background:#ece4d4;overflow:hidden;margin-top:.5rem}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:9px}
.stars{letter-spacing:1px;font-size:1.05rem}
.stars .off{filter:grayscale(1);opacity:.28}
.tasklist{display:grid;gap:.6rem}
.task{display:flex;align-items:center;gap:.8rem;cursor:pointer}
.task .n{width:38px;height:38px;border-radius:50%;background:#eaf3f3;display:grid;place-items:center;font-weight:700;flex:none}
.task.done .n{background:#fff3cd}
.task .go{margin-left:auto;color:var(--acc);font-weight:700}
.hero{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.hero .big{font-size:2.2rem;font-weight:800;color:#7a5200}
/* Layout for board tasks */
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:1rem;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.board{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{display:grid;gap:.7rem}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem}
.merk{background:#fff8e1;border:2px solid var(--acc2);border-radius:12px;padding:.7rem .85rem}
.merk b.t{display:block;color:#7a5200;margin-bottom:.15rem}
.fb{min-height:1.2rem;border-radius:12px;padding:.6rem .8rem;font-weight:600}
.fb:empty{padding:0}
.fb.ok{background:var(--okbg);color:#1b6b2f}
.fb.err{background:var(--errbg);color:var(--err)}
.fb.info{background:#e8f1f8;color:#1d4f73}
.read{display:grid;gap:.35rem}
.read div{display:flex;justify-content:space-between;background:#f3efe6;border-radius:10px;padding:.4rem .7rem;font-variant-numeric:tabular-nums}
.read div b{font-size:1.1rem}
.read.good div{background:var(--okbg);color:#1b6b2f}
.dots{display:flex;gap:.3rem;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);display:block}
.dots i.on{background:var(--acc)}
ol.steps{margin:0;padding-left:1.4rem;display:grid;gap:.35rem}
ol.steps li{padding:.3rem .5rem;border-radius:8px;color:var(--mut)}
ol.steps li.cur{background:#e8f1f8;color:var(--ink);font-weight:600}
ol.steps li.fin::marker{color:var(--ok)}
.ctl{display:grid;gap:.5rem}
.slid{display:flex;align-items:center;gap:.5rem}
.slid input[type=range]{flex:1;height:38px}
.slid .pm{width:44px;height:44px;border-radius:50%;border:2px solid var(--acc);background:#fff;color:var(--acc);font-weight:800;font-size:1.2rem;cursor:pointer}
.val{font-weight:800;font-size:1.25rem;text-align:center;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:.65rem .8rem;cursor:pointer;min-height:46px}
.opt:hover{border-color:var(--acc)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--errbg);border-color:var(--err);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q{font-weight:700;font-size:1.1rem;margin-bottom:.5rem}
/* Glossary */
.gl{border-bottom:2px dotted var(--acc);cursor:help}
#pop{position:fixed;z-index:50;background:#22303c;color:#fff;padding:.4rem .7rem;border-radius:10px;font-size:.95rem;max-width:260px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:60;background:#fff3cd;border:2px solid var(--acc2);color:#7a5200;font-weight:800;font-size:1.2rem;padding:.6rem 1.2rem;border-radius:99px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.show{display:block;animation:pop .5s}
@keyframes pop{0%{transform:translateX(-50%) scale(.5)}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}
.donebox{margin-top:1rem;border:2px solid var(--acc2);background:#fffaf0}
/* Words */
.flash{max-width:560px;margin:0 auto;text-align:center}
.flash .w{font-size:1.8rem;font-weight:800}
.flash svg,.pic svg{width:200px;height:150px;max-width:100%}
.art-der{color:#1c6fd1}.art-die{color:#d6336c}.art-das{color:#2f9e44}
.tiles{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;min-height:54px}
.tile{background:#fff;border:2px solid var(--acc);border-radius:10px;padding:.5rem .8rem;font-weight:700;cursor:pointer;font-size:1.1rem;min-height:46px}
.tile.used{opacity:.25;pointer-events:none}
.build{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:.5rem;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;align-items:center;background:#fff;font-size:1.2rem;font-weight:700}
.inp{width:100%;max-width:460px;padding:.7rem .8rem;border:2px solid var(--line);border-radius:12px;font-size:1.3rem;text-align:center;background:#fff;letter-spacing:.5px}
.inp:focus{outline:none;border-color:var(--acc)}
.mask{font:700 1.7rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px}
.center{text-align:center;display:grid;gap:.8rem;justify-items:center}
.prog{font-size:.92rem;color:var(--mut)}
.sort{display:grid;gap:.4rem}
.sort .it{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--line);border-radius:12px;padding:.45rem .6rem}
.sort .it span{flex:1}
.sort .it button{width:40px;height:40px;border-radius:10px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-weight:800;cursor:pointer}
.sort .it.right{border-color:var(--ok);background:var(--okbg)}
.sort .it.wrong{border-color:var(--err);background:var(--errbg)}
select.gap{font-weight:700;border:2px solid var(--acc);border-radius:8px;padding:.2rem .3rem;background:#fff;margin:.15rem 0}
select.gap.right{border-color:var(--ok);background:var(--okbg)} select.gap.wrong{border-color:var(--err);background:var(--errbg)}
.gaptext{line-height:2.3}
/* SVG board styles (1 cm = 100 units) */
.board .g1{stroke:#dfe7ee;stroke-width:1.5} .board .g2{stroke:#eef3f7;stroke-width:1}
.board line,.board circle,.board path,.board polyline,.board polygon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.board .giv{stroke:#22303c;stroke-width:5}
.board .aux{stroke:#8793a0;stroke-width:3;stroke-dasharray:14 12}
.board .thin{stroke:#8793a0;stroke-width:3}
.board .k{stroke:var(--k);stroke-width:5} .board .ms{stroke:var(--ms);stroke-width:5}
.board .wh{stroke:var(--wh);stroke-width:5} .board .mp{stroke:var(--mp);stroke-width:5}
.board .par{stroke:var(--par);stroke-width:5}
.board .tri{stroke:#22303c;stroke-width:6;fill:rgba(242,169,0,.18)}
.board .sol{stroke:var(--acc2);stroke-width:16;opacity:.75}
.board .fillk{fill:rgba(28,111,209,.12);stroke:none}
.board .pv{stroke:var(--acc);stroke-width:4;stroke-dasharray:10 10}
.board .dot{fill:#22303c;stroke:#fff;stroke-width:3}
.board .dot.open{fill:#fff;stroke:#22303c;stroke-width:5}
.board .dot.sol{fill:var(--acc2);stroke:#7a5200;stroke-width:4;opacity:1}
.board .dot.mk{fill:var(--ok);stroke:#fff;stroke-width:3}
.board .dot.q{fill:#fff;stroke:var(--acc);stroke-width:5}
.board text{font:600 38px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#22303c;stroke:none;paint-order:stroke}
.board text.h{stroke:#fff;stroke-width:9px}
.board text.c-k{fill:var(--k)} .board text.c-ms{fill:var(--ms)} .board text.c-wh{fill:var(--wh)} .board text.c-mp{fill:var(--mp)} .board text.c-par{fill:var(--par)} .board text.c-acc{fill:var(--acc)}
.board .hot{fill:rgba(31,111,120,.001);stroke:rgba(31,111,120,.35);stroke-width:4;stroke-dasharray:10 9;cursor:pointer}
.board .hot:hover{fill:rgba(31,111,120,.12)}
.board .handle{fill:var(--acc2);stroke:#7a5200;stroke-width:5;cursor:grab}
.board .anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cert{text-align:center;border:3px double var(--acc2)}
</style>
</head>
<body>
<header id="top">
  <div class="brand" id="brand">📐 Ortslinien</div>
  <span class="pill" id="who" hidden></span>
  <span class="pill" id="cloud" hidden title="Speicher-Status"></span>
  <span class="pill star" id="starcount" hidden>⭐ 0</span>
  <button id="logout" hidden>Abmelden</button>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="pop"></div>
<script>
'use strict';
/* =====================================================================
   EINSTELLUNGEN FÜR DIE LEHRKRAFT
   Die Seite arbeitet mit dem „Fortschritt-Server“ (Google Sheet + Code.gs).
   Die Server-ID kommt normalerweise aus dem Link:  ...?u=7a-03&s=<Server-ID>
   (so stehen die Links auf den Zugangskarten / QR-Codes).
   SERVER_ID : optional fest eintragen (Teil der Web-App-URL zwischen /s/ und /exec).
               Ohne Server-ID wird nur auf dem Gerät gespeichert.
   APP_ID    : Name der Seite im Sheet (Blatt „📊 <APP_ID>“ und Zeile in „Seiten“).
   ===================================================================== */
const CONFIG = {
  SERVER_ID: '',
  APP_ID: 'ortslinien-7',
  TITEL: 'Ortslinien (Mathematik 7)'
};
const QS = new URLSearchParams(location.search);
const SERVER_ID = (QS.get('s') || CONFIG.SERVER_ID || '').replace(/[^A-Za-z0-9_-]/g, '');
const SERVER_URL = SERVER_ID ? 'https://script.google.com/macros/s/' + SERVER_ID + '/exec' : '';
const PAGE_LINK = /^https:/.test(location.href) ? location.origin + location.pathname : '';

/* ---------- kleine Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (typeof props === 'string') e.innerHTML = props;
  else if (props) for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k === 'html') e.innerHTML = props[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const num = v => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(1).replace('.', ','));
const cm = v => num(v) + '&nbsp;cm';
const f1 = v => v.toFixed(1).replace('.', ',');

/* ---------- Glossar (Deutsch -> Englisch als Hilfe) ---------- */
const GLOSS = {
  'Ortslinien': 'loci (lines of points with the same property)', 'Ortslinie': 'locus (line of all points with the same property)',
  'Abstand': 'distance', 'gleich weit entfernt': 'equidistant (the same distance away)', 'entfernt': 'away',
  'Mittelsenkrechten': 'perpendicular bisector', 'Mittelsenkrechte': 'perpendicular bisector',
  'Winkelhalbierenden': 'angle bisector(s)', 'Winkelhalbierende': 'angle bisector',
  'Mittelparallelen': 'mid-parallel line', 'Mittelparallele': 'mid-parallel line (halfway between two parallel lines)',
  'Parallelenpaar': 'pair of parallel lines', 'Parallelen': 'parallel lines', 'Parallele': 'parallel line', 'parallel': 'parallel',
  'Schnittpunkte': 'points of intersection', 'Schnittpunkt': 'point of intersection',
  'Geraden': 'straight line(s)', 'Gerade': 'straight line', 'Halbgerade': 'ray', 'Strecke': 'line segment',
  'Kreise': 'circles', 'Kreis': 'circle', 'Radius': 'radius', 'Zirkel': 'compasses', 'Lineal': 'ruler', 'Geodreieck': 'set square',
  'Senkrechte': 'perpendicular line', 'senkrecht': 'perpendicular (at 90°)', 'Schenkeln': 'arms of the angle', 'Schenkel': 'arm of an angle',
  'Winkel': 'angle', 'Dreiecke': 'triangles', 'Dreieck': 'triangle', 'Seite': 'side', 'Höhe': 'height (altitude)',
  'Eigenschaft': 'property', 'schneiden sich': 'intersect', 'schneidet': 'intersects', 'deckungsgleich': 'congruent (same shape and size)',
  'Konstruktionsbeschreibung': 'description of the construction', 'Bedingungen': 'conditions', 'Bedingung': 'condition',
  'Mitte': 'middle / midpoint', 'gegenüber': 'opposite', 'Schatz': 'treasure', 'Reihenfolge': 'order', 'Hälfte': 'half',
  'Konstruiere': 'construct (draw exactly with compasses and ruler)', 'Markiere': 'mark', 'Bestimme': 'determine / find', 'Beschreibe': 'describe',
  'Verbinde': 'connect', 'Stelle': 'set', 'weniger als': 'less than', 'Inneren': 'inside', 'Lösung': 'solution'
};
const GLRE = new RegExp('(^|[^A-Za-zÄÖÜäöüß])(' + Object.keys(GLOSS).sort((a, b) => b.length - a.length).join('|') + ')(?![A-Za-zÄÖÜäöüß])', 'g');
/* T(): markiert Fachwörter im Text. Antippen zeigt die englische Bedeutung. */
function T(html) {
  return String(html).split(/(<[^>]+>)/).map(p => p.startsWith('<') ? p : p.replace(GLRE, (m, pre, w) => `${pre}<span class="gl" data-en="${GLOSS[w]}">${w}</span>`)).join('');
}
document.addEventListener('click', e => {
  const pop = $('#pop'), g = e.target.closest && e.target.closest('.gl');
  if (!g) { pop.style.display = 'none'; return; }
  pop.textContent = '🇬🇧 ' + g.dataset.en; pop.style.display = 'block';
  const r = g.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(window.innerWidth - pop.offsetWidth - 8, r.left)) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
});
window.addEventListener('scroll', () => { $('#pop').style.display = 'none'; }, true);
function speak(text) {
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { }
}

/* ---------- Zustand, Speichern, Google Sheet ---------- */
let ST = null;               // {user:{u,pin,name,klasse}, stars:{}, err:0, errs:{}, sec:0, best:0}
let CUR = null;              // aktuelle Aufgabe (für die Fehlerzählung pro Aufgabe)
const LS = 'ortslinien_v2';
const userKey = u => LS + ':' + String(u.u).toLowerCase();
function totalStars() { return Object.keys(ST.stars).length; }
function maxStars() { return STATIONS.reduce((s, x) => s + x.tasks.reduce((t, y) => t + (y.stars || 1), 0), 0); }
function stationStars(st) { return st.tasks.reduce((s, t) => s + starsOf(t), 0); }
function starsOf(t) { const n = t.stars || 1; let c = 0; for (let i = 1; i <= n; i++) if (ST.stars[n === 1 ? t.id : t.id + '.' + i]) c++; return c; }
function saveLocal() {
  try { localStorage.setItem(userKey(ST.user), JSON.stringify(ST)); localStorage.setItem(LS + ':last', JSON.stringify(ST.user)); } catch (e) { }
}
let dirty = false, syncT = null, syncing = false;
function save() { saveLocal(); dirty = true; clearTimeout(syncT); syncT = setTimeout(sync, 1500); header(); }
const taskMax = t => t.stars || 1;
function summary() {
  const tasks = {}; let done = 0, n = 0;
  STATIONS.forEach(st => st.tasks.forEach((t, i) => {
    const mx = taskMax(t), got = starsOf(t), e = (ST.errs || {})[t.id] || 0, d = t.id === 'T' ? (ST.best ? 1 : 0) : (got >= mx ? 1 : 0);
    n++; done += d; tasks[t.id] = [got, mx, e, d, 1, t.id === 'T' ? 'Test' : st.id + (i + 1), st.title + ': ' + t.title];
  }));
  const extra = { test: ['Test-Bestwert', (ST.best || 0) + ' von 10'], min: ['Minuten', String(Math.round((ST.sec || 0) / 60))] };
  STATIONS.forEach(st => { extra['st' + st.id] = ['⭐ ' + st.title, stationStars(st) + ' von ' + st.tasks.reduce((a, t) => a + taskMax(t), 0)]; });
  return { stars: totalStars(), max: maxStars(), err: ST.err || 0, done, n, tasks, extra };
}
function payload() {
  return { action: 'save', u: ST.user.u, p: ST.user.pin, app: CONFIG.APP_ID, titel: CONFIG.TITEL, link: PAGE_LINK, t: Date.now(),
    state: { stars: ST.stars, err: ST.err, errs: ST.errs, sec: ST.sec, best: ST.best }, sum: summary() };
}
async function api(data) {
  const r = await fetch(SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data), redirect: 'follow' });
  return await r.json();
}
function cloud(state) {
  const c = $('#cloud'); if (!ST) { c.hidden = true; return; } c.hidden = false;
  c.textContent = { off: '💾 nur auf diesem Gerät', ok: '☁️ gespeichert', busy: '☁️ speichert …', err: '⚠️ offline – wird später gespeichert' }[state];
}
async function sync() {
  if (!ST || !SERVER_URL) { cloud('off'); return; }
  if (syncing || !dirty) return;
  syncing = true; dirty = false; cloud('busy');
  try { const r = await api(payload()); if (r && r.ok) cloud('ok'); else throw new Error(r && r.err); }
  catch (e) { dirty = true; cloud('err'); }
  syncing = false;
  if (dirty) { clearTimeout(syncT); syncT = setTimeout(sync, 20000); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && ST) {
    saveLocal();
    if (SERVER_URL && dirty) try { if (navigator.sendBeacon(SERVER_URL, new Blob([JSON.stringify(payload())], { type: 'text/plain;charset=utf-8' }))) dirty = false; } catch (e) { }
  }
});
setInterval(() => { if (ST && document.visibilityState === 'visible') { ST.sec = (ST.sec || 0) + 10; if (ST.sec % 60 === 0) { saveLocal(); dirty = true; if (ST.sec % 300 === 0) sync(); } } }, 10000);

function miss() { if (ST) { ST.err = (ST.err || 0) + 1; if (CUR) { ST.errs = ST.errs || {}; ST.errs[CUR] = (ST.errs[CUR] || 0) + 1; } saveLocal(); dirty = true; } }
function award(id) {
  if (ST.stars[id]) return false;
  ST.stars[id] = 1; save();
  const t = $('#toast'); t.textContent = '⭐ +1 Stern!'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
  return true;
}
function header() {
  const on = !!ST;

      }

function mc(host, q, opts, onRight) {
  const box = el('div', { class: 'box' }, el('div', { class: 'q', html: T(q) }));
  const list = el('div', { class: 'opts' }), fb = el('div', { class: 'fb' });

    const b = el('button', { class: 'opt', html: o.t });

      if (locked) return;
      if (o.ok) { locked = true; b.classList.add('right'); fb.className = 'fb ok'; fb.innerHTML = T('Richtig! ' + (o.fb || '')); onRight && onRight(firstTry); }

/* ---------- Geometrie ---------- */
const V = {

  unit: a => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; }, perp: a => ({ x: -a.y, y: a.x }),
  dot: (a, b) => a.x * b.x + a.y * b.y, cross: (a, b) => a.x * b.y - a.y * b.x, mid: (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }),
  ang: deg => ({ x: Math.cos(deg * Math.PI / 180), y: -Math.sin(deg * Math.PI / 180) })   // y zeigt im Bild nach unten

const Ln = (p, d) => ({ p, d: V.unit(d) });                       // Gerade: Punkt + Richtung
const LnPP = (a, b) => Ln(a, V.sub(b, a));
const sdLine = (P, l) => V.cross(l.d, V.sub(P, l.p));              // Abstand mit Vorzeichen
const dLine = (P, l) => Math.abs(sdLine(P, l));
const proj = (P, l) => V.add(l.p, V.mul(l.d, V.dot(V.sub(P, l.p), l.d)));
const shift = (l, k) => Ln(V.add(l.p, V.mul(V.perp(l.d), k)), l.d);
const bisector = (A, B) => Ln(V.mid(A, B), V.perp(V.sub(B, A)));
function xLL(l, m) { const c = V.cross(l.d, m.d); if (Math.abs(c) < 1e-9) return null; const t = V.cross(V.sub(m.p, l.p), m.d) / c; return V.add(l.p, V.mul(l.d, t)); }
function xLC(l, C, r) { const F = proj(C, l), d = V.dist(F, C); if (d > r) return []; const h = Math.sqrt(r * r - d * d); return [V.add(F, V.mul(l.d, h)), V.add(F, V.mul(l.d, -h))]; }

/* ---------- Zeichenbrett (SVG, 1 cm = 100 Einheiten) ---------- */
const NS = 'http://www.w3.org/2000/svg', U = 100;

  for (let x = 0; x <= W * 2; x++) S('line', { x1: x * 50, y1: 0, x2: x * 50, y2: H * U, class: x % 2 ? 'g2' : 'g1' }, grid);
  for (let y = 0; y <= H * 2; y++) S('line', { x1: 0, y1: y * 50, x2: W * U, y2: y * 50, class: y % 2 ? 'g2' : 'g1' }, grid);
  // Maßstab
  const sc = S('g', {}, svg); S('line', { x1: 30, y1: H * U - 30, x2: 130, y2: H * U - 30, class: 'thin' }, sc);
  S('line', { x1: 30, y1: H * U - 42, x2: 30, y2: H * U - 18, class: 'thin' }, sc); S('line', { x1: 130, y1: H * U - 42, x2: 130, y2: H * U - 18, class: 'thin' }, sc);
  const st = S('text', { x: 80, y: H * U - 44, 'text-anchor': 'middle', style: 'font-size:26px;fill:#8793a0' }, sc); st.textContent = '1 cm';
  const L = {};
  for (const n of ['fill', 'loc', 'obj', 'pv', 'aux', 'pts', 'lab', 'hot', 'top']) L[n] = S('g', {}, svg);
  const b = {
    svg, W, H, layer: n => L[n], clear: n => { L[n].innerHTML = ''; },
    seg(a, c, cls = 'giv', ly = 'obj') { return S('line', { x1: a.x * U, y1: a.y * U, x2: c.x * U, y2: c.y * U, class: cls }, L[ly]); },
    line(l, cls = 'giv', ly = 'obj', anim) { const a = V.add(l.p, V.mul(l.d, -40)), c = V.add(l.p, V.mul(l.d, 40)); const e = b.seg(a, c, cls, ly); if (anim) { e.setAttribute('pathLength', 1); e.classList.add('anim'); } return e; },
    ray(p, d, cls = 'giv', ly = 'obj') { return b.seg(p, V.add(p, V.mul(V.unit(d), 40)), cls, ly); },
    circle(c, r, cls = 'k', ly = 'loc', anim) { const e = S('circle', { cx: c.x * U, cy: c.y * U, r: r * U, class: cls }, L[ly]); if (anim) { e.setAttribute('pathLength', 1); e.classList.add('anim'); } return e; },
    poly(pts, cls = 'tri', ly = 'obj') { return S('polygon', { points: pts.map(p => p.x * U + ',' + p.y * U).join(' '), class: cls }, L[ly]); },
    dot(p, label, cls = '', off, tcls = '') { const e = S('circle', { cx: p.x * U, cy: p.y * U, r: 11, class: 'dot ' + cls }, L.pts); if (label) b.text(V.add(p, off || { x: .22, y: -.22 }), label, tcls); return e; },
    text(p, str, cls = '', ly = 'lab') { const t = S('text', { x: p.x * U, y: p.y * U, class: 'h ' + cls }, L[ly]); t.innerHTML = str; return t; },
    hot(p, ly = 'hot') { return S('circle', { cx: p.x * U, cy: p.y * U, r: 46, class: 'hot' }, L[ly]); },
    rightAngle(p, d1, d2, ly = 'aux') { const u = V.mul(V.unit(d1), .3), v = V.mul(V.unit(d2), .3), a = V.add(p, u), c = V.add(a, v), d = V.add(p, v); return S('polyline', { points: [a, c, d].map(q => q.x * U + ',' + q.y * U).join(' '), class: 'thin' }, L[ly]); },
    arc(c, r, a0, a1, cls = 'thin', ly = 'aux') { // Winkel in Grad, mathematisch (gegen den Uhrzeigersinn)
      const p0 = V.add(c, V.mul(V.ang(a0), r)), p1 = V.add(c, V.mul(V.ang(a1), r)), big = Math.abs(a1 - a0) > 180 ? 1 : 0;
      return S('path', { d: `M${p0.x * U} ${p0.y * U} A${r * U} ${r * U} 0 ${big} ${a1 > a0 ? 0 : 1} ${p1.x * U} ${p1.y * U}`, class: cls }, L[ly]);
    },
    pos(ev) { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return { x: q.x / U, y: q.y / U }; },
    inside(p, m = .4) { return p.x > m && p.y > m && p.x < W - m && p.y < H - m; }

}
function lineLabel(b, l, name, t = 5, cls = '') { b.text(V.add(V.add(l.p, V.mul(l.d, t)), V.mul(V.perp(l.d), -.3)), name, cls); }

/* ---------- Schritt-für-Schritt-Konstruktion ---------- */

  const left = el('div'), right = el('div', { class: 'panel' }), two = el('div', { class: 'two' }, left, right); host.append(two);
  const b = Board(left, cfg.W || 14, cfg.H || 9);

  const say = (c, h) => { fb.className = 'fb ' + c; fb.innerHTML = T(h); };
  cfg.init(ctx);
  let i = -1, li = null;
  function hots(handler) { b.clear('hot'); if (!handler) return; for (const n in ctx.tap) { const c = b.hot(ctx.tap[n]); c.addEventListener('pointerdown', ev => { ev.preventDefault(); handler(n); }); } }

    if (s.type === 'tap') {
      const rest = new Set(s.targets(ctx));
      hots(n => {
        if (rest.has(n)) { rest.delete(n); if (s.onTap) s.onTap(ctx, n); if (s.any || !rest.size) { if (s.done) s.done(ctx, n); next(); } else say('ok', 'Gut! Es fehlt noch ein Punkt.'); }
        else { miss(); say('err', s.wrong || 'Das ist nicht der richtige Punkt. Lies den Schritt noch einmal genau.'); }

      r.addEventListener('input', upd);
      const pm = k => el('button', { class: 'pm', html: k < 0 ? '−' : '+', onclick: () => { r.value = Math.min(c.max, Math.max(c.min, +r.value + k * c.step)); upd(); } });
      ctl.append(val, el('div', { class: 'slid' }, pm(-1), r, pm(1)), el('button', { class: 'btn', html: 'Fertig ✓', onclick: () => { const v = +r.value, ok = c.valid(ctx, v); if (ok === true) { b.clear('pv'); s.done(ctx, v); next(); } else { miss(); say('err', ok); } } }));
      upd();
    } else if (s.type === 'choice') {
      const list = el('div', { class: 'opts' });
      shuffle(s.options(ctx)).forEach(o => { const bt = el('button', { class: 'opt', html: T(o.t) }); bt.addEventListener('click', () => { if (o.ok) { s.done(ctx); next(); } else { miss(); bt.classList.add('wrong'); say('err', o.why || 'Das passt nicht. Überlege noch einmal.'); } }); list.append(bt); });

    } else if (s.type === 'button') {
      ctl.append(el('button', { class: 'btn', html: s.label, onclick: () => { s.done(ctx); next(); } }));
    }
    if (s.say) say('info', s.say); else if (i > 0) say('ok', 'Gut! Weiter mit dem nächsten Schritt.'); else say('', '');

function sorter(host, intro, steps, done) {
  let order = shuffle(steps.map((s, i) => i)); if (order.every((v, i) => v === i)) order.reverse();
  const list = el('div', { class: 'sort' }), fb = el('div', { class: 'fb' });
  const card = el('div', { class: 'card', style: 'max-width:760px;margin:0 auto;display:grid;gap:.7rem' }, el('div', { html: T(intro) }), list, el('button', { class: 'btn', html: 'Prüfen ✓', onclick: check }), fb); host.append(card);
  let fin = false;
  function draw(mark) {
    list.innerHTML = '';
    order.forEach((si, pos) => {
      const it = el('div', { class: 'it' + (mark ? (si === pos ? ' right' : ' wrong') : '') }, el('b', (pos + 1) + '.'), el('span', { html: T(steps[si]) }));
      if (!fin) it.append(el('button', { html: '▲', onclick: () => mv(pos, -1) }), el('button', { html: '▼', onclick: () => mv(pos, 1) }));
      list.append(it);
    });
  }
  function mv(p, d) { const q = p + d; if (q < 0 || q >= order.length) return;[order[p], order[q]] = [order[q], order[p]]; draw(false); }
  function check() {
    if (fin) return;
    if (order.every((v, i) => v === i)) { fin = true; draw(true); fb.className = 'fb ok'; fb.innerHTML = 'Richtig! So schreibt man eine Konstruktionsbeschreibung.'; done(); }
    else { miss(); draw(true); fb.className = 'fb err'; fb.innerHTML = 'Die Reihenfolge stimmt noch nicht. Grün = richtige Stelle, rot = falsche Stelle.'; }
  }
  draw(false);
}

function finalTest(host) {

  const card = el('div', { class: 'card', style: 'max-width:760px;margin:0 auto' }); host.append(card);
  function ask() {
    card.innerHTML = '';
    if (i >= qs.length) return result();
    const [q, right, ...wrong] = qs[i];
    card.append(el('div', { class: 'prog', html: `Frage ${i + 1} von ${qs.length}` }), el('div', { class: 'q', html: T(q) }));
    const list = el('div', { class: 'opts' }), fb = el('div', { class: 'fb', style: 'margin-top:.6rem' }); let locked = false;
    shuffle([right, ...wrong]).forEach(t => {
      const b = el('button', { class: 'opt', html: t });
      b.addEventListener('click', () => {
        if (locked) return; locked = true;
        if (t === right) { score++; b.classList.add('right'); fb.className = 'fb ok'; fb.innerHTML = 'Richtig!'; }
        else { miss(); b.classList.add('wrong'); list.querySelectorAll('.opt').forEach(o => { if (o.dataset.r) o.classList.add('right'); }); fb.className = 'fb err'; fb.innerHTML = 'Leider falsch. Die richtige Antwort ist grün.'; }
        i++; weiter(card, ask, i >= qs.length ? 'Ergebnis ansehen →' : 'Nächste Frage →');
      });
      if (t === right) b.dataset.r = 1; list.append(b);
    });
    card.append(list, fb);
  }
  function result() {
    ST.best = Math.max(ST.best || 0, score); const n = score >= 10 ? 3 : score >= 8 ? 2 : score >= 6 ? 1 : 0; let got = false;
    for (let k = 1; k <= n; k++) got = award('T.' + k) || got; save();
    card.className = 'card cert';
    card.append(el('h2', score >= 8 ? '🏆 Stark!' : score >= 6 ? '👍 Gut gemacht!' : '💪 Übe noch ein bisschen!'), el('p', { html: `<span style="font-size:2rem;font-weight:800">${score} von 10</span> Fragen richtig.` }),
      el('p', { html: starRow(n, 3) + '<br><span class="mut">6 richtige = 1 Stern · 8 richtige = 2 Sterne · 10 richtige = 3 Sterne</span>' }),
      el('p', { html: `<b>${ST.user.name}</b> – insgesamt ⭐ ${totalStars()} von ${maxStars()} Sternen` }),

}
